name: Deploy fileStacker to s3

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent deployments from running at the same time.
concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
 
  AWS_REGION: ap-south-2
  BUILD_DIR: dist # Use "build" for Create React App.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: envconfig

    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Download your repository onto the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Prepare Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          check-latest: true
          cache: npm
          cache-dependency-path: client/package-lock.json

      # 3. Install dependencies using package-lock.json.
      - name: Install dependencies
        run: npm ci

      # 4. Generate the production website files.
      - name: Build application
        run: npm run build

      # 5. Verify the build before syncing with --delete.
      - name: Verify build output
        run: test -f "$BUILD_DIR/index.html"

      # 6. Obtain temporary AWS credentials through OIDC.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ${{env.AWS_REGION}}
      
      - name: Check AWS connection
        run: aws sts get-caller-identity

      # 7. Upload the build and remove obsolete destination files.
      - name: Sync to S3
        env:
          S3_BUCKET_NAME: ${{secrets.S3_BUCKET_NAME}}
        run: |
          aws s3 sync "$BUILD_DIR/" "s3://$S3_BUCKET_NAME/" --delete

      # 8. Request removal of cached website files.
      # - name: Invalidate CloudFront cache
      #   env:
      #     DISTRIBUTION_ID: ${{secrets.DISTRIBUTION_ID}}
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id "$DISTRIBUTION_ID" \
      #       --paths "/*"
